<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Processeur vu de dessus : un boîtier contenant 4 cœurs de calcul">
  <title>Processeur à 4 cœurs</title>
  <!-- Pins -->
  <g fill="#9aa0a6">
    <rect x="95" y="14" width="18" height="44" rx="6"/><rect x="143" y="14" width="18" height="44" rx="6"/>
    <rect x="191" y="14" width="18" height="44" rx="6"/><rect x="239" y="14" width="18" height="44" rx="6"/>
    <rect x="287" y="14" width="18" height="44" rx="6"/>
    <rect x="95" y="342" width="18" height="44" rx="6"/><rect x="143" y="342" width="18" height="44" rx="6"/>
    <rect x="191" y="342" width="18" height="44" rx="6"/><rect x="239" y="342" width="18" height="44" rx="6"/>
    <rect x="287" y="342" width="18" height="44" rx="6"/>
    <rect x="14" y="95" width="44" height="18" rx="6"/><rect x="14" y="143" width="44" height="18" rx="6"/>
    <rect x="14" y="191" width="44" height="18" rx="6"/><rect x="14" y="239" width="44" height="18" rx="6"/>
    <rect x="14" y="287" width="44" height="18" rx="6"/>
    <rect x="342" y="95" width="44" height="18" rx="6"/><rect x="342" y="143" width="44" height="18" rx="6"/>
    <rect x="342" y="191" width="44" height="18" rx="6"/><rect x="342" y="239" width="44" height="18" rx="6"/>
    <rect x="342" y="287" width="44" height="18" rx="6"/>
  </g>
  <!-- Package and die -->
  <rect x="48" y="48" width="304" height="304" rx="26" fill="#2f343b"/>
  <rect x="72" y="72" width="256" height="256" rx="12" fill="#454b54"/>
  <!-- Cores -->
  <g fill="#5c6bc0">
    <rect x="86" y="86" width="108" height="108" rx="10"/>
    <rect x="206" y="86" width="108" height="108" rx="10"/>
    <rect x="86" y="206" width="108" height="108" rx="10"/>
    <rect x="206" y="206" width="108" height="108" rx="10"/>
  </g>
  <g fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="140" y="140" font-size="28">Cœur</text><text x="140" y="174" font-size="26">1</text>
    <text x="260" y="140" font-size="28">Cœur</text><text x="260" y="174" font-size="26">2</text>
    <text x="140" y="260" font-size="28">Cœur</text><text x="140" y="294" font-size="26">3</text>
    <text x="260" y="260" font-size="28">Cœur</text><text x="260" y="294" font-size="26">4</text>
  </g>
</svg>
