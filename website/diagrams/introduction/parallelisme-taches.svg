<svg xmlns="http://www.w3.org/2000/svg" class="diagram diagram-wide" viewBox="0 0 640 232" role="img" aria-label="Parallélisme de tâches : trois unités de calcul exécutent en même temps trois tâches différentes, la simulation de l'atmosphère, la simulation de l'océan, l'analyse et l'écriture des résultats, et échangent des données">
<defs><marker id="ar-taches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="cpu" x="40" y="14" width="140" height="40" rx="6"/><text x="110" y="34">Unité 1</text>
<rect class="cpu" x="250" y="14" width="140" height="40" rx="6"/><text x="320" y="34">Unité 2</text>
<rect class="cpu" x="460" y="14" width="140" height="40" rx="6"/><text x="530" y="34">Unité 3</text>
<line class="link" x1="110" y1="54" x2="110" y2="78" marker-end="url(#ar-taches)"/>
<line class="link" x1="320" y1="54" x2="320" y2="78" marker-end="url(#ar-taches)"/>
<line class="link" x1="530" y1="54" x2="530" y2="78" marker-end="url(#ar-taches)"/>
<rect class="blk-b" x="25" y="80" width="170" height="80" rx="8"/><text class="on-blk" x="110" y="108">Simulation</text><text class="on-blk" x="110" y="132">de l'atmosphère</text>
<rect class="blk-c" x="235" y="80" width="170" height="80" rx="8"/><text class="on-blk" x="320" y="108">Simulation</text><text class="on-blk" x="320" y="132">de l'océan</text>
<rect class="blk-d" x="445" y="80" width="170" height="80" rx="8"/><text class="on-blk" x="530" y="108">Analyse et écriture</text><text class="on-blk" x="530" y="132">des résultats</text>
<line class="link" x1="198" y1="120" x2="232" y2="120" marker-start="url(#ar-taches)" marker-end="url(#ar-taches)"/>
<line class="link" x1="408" y1="120" x2="442" y2="120" marker-start="url(#ar-taches)" marker-end="url(#ar-taches)"/>
<text class="small" x="320" y="186">les tâches s'échangent des données à intervalles réguliers</text>
<text class="small" x="320" y="212">chaque unité exécute une tâche différente, en même temps que les autres</text>
</svg>
