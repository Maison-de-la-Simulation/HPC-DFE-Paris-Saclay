<svg xmlns="http://www.w3.org/2000/svg" class="diagram diagram-wide" viewBox="0 0 640 450" role="img" aria-label="Les briques d'un super-calculateur, de la plus petite à la plus grande : le cœur, le processeur (socket) qui regroupe des dizaines de cœurs, le nœud (lame) avec 1 ou 2 processeurs et de la RAM, le châssis qui regroupe plusieurs lames, l'armoire (rack) qui regroupe plusieurs châssis et les switchs du réseau, et le super-calculateur fait de dizaines à centaines d'armoires">
