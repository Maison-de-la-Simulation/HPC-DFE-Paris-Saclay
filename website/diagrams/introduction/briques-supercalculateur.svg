<rect class="mem" x="455" y="30" width="150" height="110" rx="8"/>
<rect class="bus" x="467" y="55" width="46" height="46" rx="5"/><rect class="node" x="478" y="66" width="24" height="24" rx="3"/>
<rect class="bus" x="523" y="55" width="46" height="46" rx="5"/><rect class="node" x="534" y="66" width="24" height="24" rx="3"/>
<rect class="blk-c" x="578" y="42" width="6" height="86" rx="2"/><rect class="blk-c" x="588" y="42" width="6" height="86" rx="2"/>
