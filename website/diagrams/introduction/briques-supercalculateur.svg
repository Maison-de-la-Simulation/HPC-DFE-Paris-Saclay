<text x="110" y="168">1. Cœur</text>
<text class="small" x="110" y="186">une unité de calcul</text>
<text x="320" y="168">2. Processeur (socket)</text>
<text class="small" x="320" y="186">des dizaines de cœurs</text>
<text x="530" y="168">3. Nœud (lame)</text>
<text class="small" x="530" y="186">1 ou 2 processeurs, de la RAM,</text>
<text class="small" x="530" y="202">parfois des GPU</text>
<text x="110" y="412">4. Châssis</text>
<text class="small" x="110" y="430">plusieurs lames, alimentation</text>
<text class="small" x="110" y="446">et refroidissement communs</text>
<text x="320" y="412">5. Armoire (rack)</text>
<text class="small" x="320" y="430">plusieurs châssis</text>
<text class="small" x="320" y="446">et les switchs du réseau</text>
<text x="530" y="412">6. Super-calculateur</text>
<text class="small" x="530" y="430">des dizaines à centaines d'armoires</text>
<text class="small" x="530" y="446">reliées par le réseau</text>
</svg>
