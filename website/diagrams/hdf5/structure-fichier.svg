<svg xmlns="http://www.w3.org/2000/svg" class="diagram diagram-wide" viewBox="0 0 680 350" role="img" aria-label="Structure d'un fichier HDF5 : le groupe racine contient un attribut et deux groupes ; le groupe maillage contient les datasets x et y ; le groupe temps_0010 porte l'attribut t et contient les datasets temperature et pression, chacun avec un attribut unite">
<text class="small start" x="20" y="12">fichier resultats.h5</text>
<line class="link" x1="40" y1="56" x2="40" y2="233"/>
<line class="link" x1="40" y1="88" x2="60" y2="88"/>
<line class="link" x1="40" y1="233" x2="60" y2="233"/>
<line class="link" x1="80" y1="106" x2="80" y2="183"/>
<line class="link" x1="80" y1="138" x2="120" y2="138"/>
<line class="link" x1="80" y1="183" x2="120" y2="183"/>
<line class="link" x1="80" y1="251" x2="80" y2="323"/>
<line class="link" x1="80" y1="278" x2="120" y2="278"/>
<line class="link" x1="80" y1="323" x2="120" y2="323"/>
<rect class="bus" x="20" y="20" width="150" height="36" rx="6"/>
<text class="start" x="32" y="38">/  (groupe racine)</text>
<rect class="bus" x="60" y="70" width="150" height="36" rx="6"/>
<text class="start" x="72" y="88">maillage</text>
<rect class="cpu" x="120" y="120" width="230" height="36" rx="6"/>
<text class="start" x="132" y="138">x</text><text class="small start" x="200" y="138">1D, 100 réels</text>
<rect class="cpu" x="120" y="165" width="230" height="36" rx="6"/>
<text class="start" x="132" y="183">y</text><text class="small start" x="200" y="183">1D, 50 réels</text>
<rect class="bus" x="60" y="215" width="150" height="36" rx="6"/>
<text class="start" x="72" y="233">temps_0010</text>
<rect class="cpu" x="120" y="260" width="230" height="36" rx="6"/>
<text class="start" x="132" y="278">temperature</text><text class="small start" x="240" y="278">2D, 100 × 50</text>
<rect class="cpu" x="120" y="305" width="230" height="36" rx="6"/>
<text class="start" x="132" y="323">pression</text><text class="small start" x="240" y="323">2D, 100 × 50</text>
<line class="frame" x1="170" y1="38" x2="230" y2="38"/>
<rect class="mem" x="230" y="25" width="190" height="26" rx="13"/>
<text class="small" x="325" y="38">code = "shallow-water"</text>
<line class="frame" x1="210" y1="233" x2="370" y2="233"/>
<rect class="mem" x="370" y="220" width="130" height="26" rx="13"/>
<text class="small" x="435" y="233">t = 0.01</text>
<line class="frame" x1="350" y1="278" x2="370" y2="278"/>
<rect class="mem" x="370" y="265" width="130" height="26" rx="13"/>
<text class="small" x="435" y="278">unite = "K"</text>
<line class="frame" x1="350" y1="323" x2="370" y2="323"/>
<rect class="mem" x="370" y="310" width="130" height="26" rx="13"/>
<text class="small" x="435" y="323">unite = "Pa"</text>
<rect class="frame" x="525" y="70" width="145" height="170" rx="8"/>
<text class="small" x="597" y="88">Légende</text>
<rect class="bus" x="540" y="104" width="34" height="22" rx="5"/><text class="small start" x="584" y="115">groupe</text>
<rect class="cpu" x="540" y="146" width="34" height="22" rx="5"/><text class="small start" x="584" y="157">dataset</text>
<rect class="mem" x="540" y="188" width="34" height="22" rx="11"/><text class="small start" x="584" y="199">attribut</text>
