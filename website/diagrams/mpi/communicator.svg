<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 540 150" role="img" aria-label="Le communicateur MPI_COMM_WORLD regroupe les rangs 0 à 3 ; les rangs 2 et 3 forment un sous-communicateur">
