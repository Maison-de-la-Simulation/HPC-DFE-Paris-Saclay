<svg xmlns="http://www.w3.org/2000/svg" class="diagram diagram-wide" viewBox="0 0 640 195" role="img" aria-label="Quatre processus, chacun avec sa mémoire privée, échangent des messages">
<defs><marker id="ar-mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="mem" x="20" y="20" width="120" height="60" rx="6"/>
