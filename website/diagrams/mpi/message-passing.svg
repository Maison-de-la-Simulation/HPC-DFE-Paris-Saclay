<line class="link" x1="106" y1="130" x2="214" y2="130" marker-end="url(#ar-mp)" marker-start="url(#ar-mp)"/>
<line class="link" x1="266" y1="130" x2="374" y2="130" marker-end="url(#ar-mp)" marker-start="url(#ar-mp)"/>
<line class="link" x1="426" y1="130" x2="534" y2="130" marker-end="url(#ar-mp)" marker-start="url(#ar-mp)"/>
<text class="small" x="320" y="182">Messages : échange de données et synchronisation</text>
