<circle class="cpu" cx="80" cy="130" r="26"/>
<text x="80" y="130">P0</text>
<line class="link" x1="80" y1="80" x2="80" y2="104"/>
<rect class="mem" x="180" y="20" width="120" height="60" rx="6"/>
<text class="small" x="240" y="50">Mémoire privée</text>
<circle class="cpu" cx="240" cy="130" r="26"/>
<text x="240" y="130">P1</text>
<line class="link" x1="240" y1="80" x2="240" y2="104"/>
<rect class="mem" x="340" y="20" width="120" height="60" rx="6"/>
