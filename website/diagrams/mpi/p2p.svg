<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 580 135" role="img" aria-label="Le rang 0 envoie un message au rang 3, qui le reçoit">
<defs><marker id="ar-p2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<circle class="cpu" cx="100" cy="70" r="24"/>
<text x="100" y="70">0</text>
<circle class="cpu" cx="230" cy="70" r="24"/>
<text x="230" y="70">1</text>
<circle class="cpu" cx="360" cy="70" r="24"/>
<text x="360" y="70">2</text>
<circle class="cpu" cx="490" cy="70" r="24"/>
<text x="490" y="70">3</text>
<path class="link" d="M 110 47 C 200 -5, 410 -5, 480 46" marker-end="url(#ar-p2p)"/>
<text class="small" x="100" y="118">send(message, dest=3)</text>
<text class="small" x="490" y="118">recv(source=0)</text>
</svg>
