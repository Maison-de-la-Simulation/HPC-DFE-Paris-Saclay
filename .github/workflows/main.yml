name: CI

# Tests the Python exercises and Python TPs (exercise corrections and TP codes
# are run with small parameters to check that they execute without error).
on:
  push:
    branches: [ master, "year-*" ]
    paths:
      - "exercices/**"
      - "tp/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [ master, "year-*" ]
    paths:
      - "exercices/**"
      - "tp/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

env:
  MPLBACKEND: Agg                       # no display on the runner
  PYTHONDONTWRITEBYTECODE: "1"
  MPIRUN: mpirun --oversubscribe        # runners have fewer cores than ranks

jobs:
  # ____________________________________________________________________________
  # Syntax check of every Python file of the exercise corrections and Python TPs
  # (also covers visualization and scaling scripts that need data to run)
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          git ls-files \
            'exercices/mpi/python/*/correction/*.py' \
            'exercices/performance/correction/*.py' \
            'exercices/performance/*_scalability.py' \
            'tp/kelvin-helmholtz/*.py' \
            'tp/mandelbulb/*.py' \
            'tp/shallow/*.py' \
          | xargs python -m py_compile

  # ____________________________________________________________________________
  # MPI exercises (corrections)
  exercices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          mpirun --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install numpy matplotlib mpi4py

      - name: 1 - Initialization
        working-directory: exercices/mpi/python/initialization/correction
        run: $MPIRUN -np 4 python main.py

      - name: 2 - Embarrassingly parallel
        working-directory: exercices/mpi/python/embarrassingly_parallel/correction
        run: $MPIRUN -np 4 python main.py

      - name: 3 - Blocking communications
        working-directory: exercices/mpi/python/blocking_com/correction
        run: $MPIRUN -np 4 python main.py

      - name: 4 - Sendrecv
        working-directory: exercices/mpi/python/sendrecv/correction
        run: $MPIRUN -np 4 python main.py

      - name: 5 - Non-blocking communications
        working-directory: exercices/mpi/python/nonblocking_com/correction
        run: $MPIRUN -np 4 python main.py

      - name: 6 - Array communications
        working-directory: exercices/mpi/python/array_com/correction
        run: $MPIRUN -np 4 python main.py

      - name: 7 - Gather
        working-directory: exercices/mpi/python/gather_com/correction
        run: $MPIRUN -np 4 python main.py

      - name: 8 - Reduce
        working-directory: exercices/mpi/python/reduce_com/correction
        run: $MPIRUN -np 4 python main.py

      - name: 9 - Cartesian topology (4 x 5 grid)
        working-directory: exercices/mpi/python/cartesian_topology/correction
        run: $MPIRUN -np 20 python main.py

      - name: Performance
        working-directory: exercices/performance/correction
        run: |
          python main.py -N 1000000
          $MPIRUN -np 4 python main.py -N 1000000

  # ____________________________________________________________________________
  # Python TPs (sequential and MPI versions, small problem sizes)
  tps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages (requirements of each TP)
        run: |
          pip install \
            -r tp/kelvin-helmholtz/requirements.txt \
            -r tp/mandelbulb/requirements.txt \
            -r tp/shallow/requirements.txt

      - name: Kelvin-Helmholtz - sequential
        working-directory: tp/kelvin-helmholtz/python/seq
        run: python main.py --Nx 64 --Ny 32 --T_end 0.5

      - name: Mandelbulb - sequential
        working-directory: tp/mandelbulb/python/sequential
        run: python mandelbulb.py --domain_size 24 24 24

      - name: Mandelbulb - MPI 1D
        working-directory: tp/mandelbulb/python/mpi
        run: $MPIRUN -np 4 python mandelbulb.py --domain_size 24 24 24

      - name: Mandelbulb - MPI 3D
        working-directory: tp/mandelbulb/python/mpi
        run: $MPIRUN -np 4 python mandelbulb_3d.py --domain_size 24 24 24 --ranks_per_dir 1 2 2

      - name: Shallow water - sequential
        working-directory: tp/shallow/python/sequential
        run: python shallow_water.py -N 512 -i 200 -o 50 -p 100

      - name: Shallow water - MPI
        working-directory: tp/shallow/python/mpi
        run: $MPIRUN -np 4 python shallow_water.py -N 512 -i 200 -o 50 -p 100
